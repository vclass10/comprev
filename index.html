// Balanced sampling guarantees concept coverage in micro-checks and lesson coverage in unit/exam checks.
function sampleMicro(l){const first=l.concepts.map(c=>shuffle(l.questions.filter(q=>q.concept===c.id))[0]).filter(Boolean);return shuffle([...first,...shuffle(l.questions.filter(q=>!first.includes(q))).slice(0,5-first.length)]).map(q=>q.id);}
function sampleUnit(s,n){const order=shuffle(s.lessons),base=Math.floor(n/order.length),extra=n%order.length;return shuffle(order.flatMap((l,i)=>shuffle(l.questions).slice(0,base+(i<extra?1:0)).map(q=>q.id)));}

 const e=state.exam;
 if(!e)return pageHead('COMPREHENSIVE MOCK EXAM','Your practice run starts here.','Put your understanding to work across all four units.')+`<div class="grid two-col"><section class="card"><span class="pill blue">25 QUESTIONS · 45 MINUTES</span><h2 style="margin-top:18px">One focused attempt.</h2><ul><li>All 16 lessons are represented.</li><li>Each of the four equal-sized units contributes 6 questions; one randomly chosen unit contributes a seventh.</li><li>One mark per question. Unanswered questions score zero.</li><li>Feedback appears after submission.</li><li>You can move between questions and flag ones to revisit.</li></ul><div class="notice">The timer keeps running if you leave this page or close the browser. When time expires, the attempt submits automatically, or on reopening if the app was closed.</div><p class="small muted">This practice format uses 25 questions in 45 minutes as requested. The supplied school papers use a different length and mark allocation.</p><button class="btn" data-action="start-exam">Start 45-minute mock</button></section><section class="card"><h2>Make it count.</h2><p>Try this without the lesson notes. Your report will show both unit scores and links to the precise concepts to revise.</p><div class="callout">You can use the mock at any point. You do not need every badge to begin.</div><h3>Previous attempts</h3>${state.examHistory.length?state.examHistory.slice().reverse().map(h=>`<div class="history-row"><span><strong>${h.percent}%</strong><br><span class="small muted">${stamp(h.finishedAt)}</span></span><a href="#report/${h.id}">View report</a></div>`).join(''):'<p class="small muted">Your first report will appear here.</p>'}</section></div>`;
 const q=questions[e.ids[e.index]],done=e.ids.filter(id=>answered(questions[id],e.answers[id])).length;
 return `${pageHead('MOCK EXAM IN PROGRESS','Take it one question at a time.','Your answers save automatically. Results and explanations unlock when you submit.')}<div class="exam-shell"><section class="card" id="exam-question"><div class="row"><span class="pill blue">Question ${e.index+1} of 25</span><button class="btn secondary flag" data-action="flag-exam" aria-pressed="${!!e.flags[q.id]}">${e.flags[q.id]?'Flagged for review':'Flag for review'}</button></div><p class="question-title">${esc(q.prompt)}</p>${q.code?`<pre><code class="python">${esc(q.code)}</code></pre>`:''}${questionControls(q,e,true)}<div class="row actions"><button class="btn secondary" data-action="exam-prev" ${e.index===0?'disabled':''}>Previous</button><button class="btn" data-action="exam-next" ${e.index===24?'disabled':''}>Next question</button></div><p class="save-status" id="exam-save" role="status">Saved in this browser</p></section><aside class="exam-nav"><div class="card"><div class="timer-row"><div><span class="small muted">Time remaining</span><div class="timer" data-time></div></div><span class="small" id="exam-count">${done}/25 answered</span></div><div class="number-grid" aria-label="Jump to a question">${e.ids.map((id,i)=>`<button class="number-btn ${answered(questions[id],e.answers[id])?'answered':''} ${e.index===i?'current':''} ${e.flags[id]?'flagged':''}" data-action="exam-jump" data-index="${i}" aria-label="Question ${i+1}${answered(questions[id],e.answers[id])?', answered':', unanswered'}${e.flags[id]?', flagged':''}" ${e.index===i?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><p class="small muted">Green: answered<br>Amber underline: flagged</p><button class="btn sticky-submit" data-action="submit-exam" style="width:100%">Submit exam</button><button class="btn quiet" data-action="abandon-exam">Discard this attempt</button></div></aside></div>`;
}
function updateExamAnswer(value){if(!state.exam)return;if(Date.now()>=state.exam.deadline){finishExam(true);return;}const e=state.exam,q=questions[e.ids[e.index]];e.answers[q.id]=value;save();const count=e.ids.filter(id=>answered(questions[id],e.answers[id])).length;if($('#exam-count'))$('#exam-count').textContent=`${count}/25 answered`;const b=$(`[data-action="exam-jump"][data-index="${e.index}"]`);if(b){b.classList.toggle('answered',answered(q,value));b.setAttribute('aria-label',`Question ${e.index+1}, ${answered(q,value)?'answered':'unanswered'}${e.flags[q.id]?', flagged':''}`);}if($('#exam-save'))$('#exam-save').textContent=storageWarning?'Could not save to browser storage':'Saved in this browser';}
function finishExam(timedOut=false){
 const e=state.exam;if(!e)return;
 if($('#confirm-dialog').open)closeDialog();
 const checked=Object.fromEntries(e.ids.map(id=>[id,correct(questions[id],e.answers[id])]));
 const score=Object.values(checked).filter(Boolean).length;
 e.ids.filter(id=>checked[id]).forEach(id=>state.earned[id]=true);
 const report={...e,checked,score,percent:pct(score,25),finishedAt:Date.now(),timedOut};
 state.examHistory.push(report);state.exam=null;save();
 toast(timedOut?'Time is up. Your answers have been submitted.':'Mock submitted. Your readiness report is ready.');
 nav('#report/'+report.id);
}
function updateTimerText(){if(!state.exam)return;const left=Math.max(0,Math.ceil((state.exam.deadline-Date.now())/1000)),text=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;$$('[data-time],[data-time-inline]').forEach(el=>{el.textContent=text;el.classList.toggle('low',left<=300);});}
function timerTick(){if(state.exam){if(Date.now()>=state.exam.deadline)finishExam(true);else updateTimerText();}}
function renderReport(id){
 const h=state.examHistory.find(h=>h.id===id)||state.examHistory.at(-1);if(!h)return pageHead('EXAM READINESS','No completed mock yet.','Take a mock exam to build your topic report.')+'<a class="btn" href="#exam">Open mock exam</a>';
 const topics=lessons.map(l=>{const ids=h.ids.filter(id=>questions[id].lessonId===l.id);return {l,total:ids.length,score:ids.filter(id=>h.checked[id]).length,ids};});
 const missed=h.ids.filter(id=>!h.checked[id]).map(id=>questions[id]);const unique=[...new Map(missed.map(q=>[q.lessonId+'/'+q.concept,q])).values()];
 return pageHead('EXAM READINESS REPORT','Know what to revise next.',`${stamp(h.finishedAt)} · ${h.timedOut?'Submitted when time expired':'Submitted by you'}`)+`<section class="card report-hero"><div><div class="report-score">${h.percent}%</div><p class="muted">${h.score} of 25 correct</p></div><div><span class="pill ${h.percent>=80?'green':'amber'}">${h.percent>=80?'Strong performance':h.percent>=60?'Building confidence':'Focus your next session'}</span><h2 style="margin-top:14px">${h.percent>=80?'A strong foundation to build on.':'Your next revision steps are clear.'}</h2><p class="muted">${h.percent>=80?'Revisit any missed concepts, then explain them without the notes.':'Use the links below to review the concepts that cost marks. Retake their lesson checks before another mock.'} This small practice sample is guidance, not a guaranteed exam grade.</p></div></section><section class="card" style="margin-top:22px"><h2>Unit breakdown</h2>${sections.map(s=>{const ids=h.ids.filter(id=>questions[id].sectionId===s.id),score=ids.filter(id=>h.checked[id]).length,p=pct(score,ids.length);return `<div class="topic-row"><strong>${s.title}</strong><span>${score}/${ids.length} · ${p}%</span><span class="pill ${p>=80?'green':'amber'}">${resultLabel(p)}</span></div>`;}).join('')}<p class="help-inline">Strong: 80%+ · Developing: 60–79% · Review next: below 60%.</p></section><section class="card report-topics"><h2>Every lesson, at a glance</h2><p class="small muted">Each lesson has only 1–2 questions in this attempt, so use this alongside your lesson-check results.</p>${topics.map(t=>`<div class="topic-row"><a href="${lessonURL(t.l.id)}">${t.l.title}</a><span>${t.score}/${t.total}</span><span class="pill ${t.score===t.total?'green':'amber'}">${t.score===t.total?'Strong':'Review'}</span></div>`).join('')}</section><section class="card" style="margin-top:22px"><h2>${unique.length?'Your targeted revision list':'All concepts answered correctly'}</h2>${unique.length?`<ol>${unique.map(q=>`<li style="margin:12px 0"><a href="${lessonURL(q.lessonId,q.concept)}">${lessonMap[q.lessonId].title}: ${lessonMap[q.lessonId].concepts.find(c=>c.id===q.concept).title}</a><div class="small muted">${esc(q.explanation)}</div></li>`).join('')}</ol>`:'<p>Maintain your understanding by explaining the ideas aloud and taking another shuffled practice run later.</p>'}<div class="row actions"><a class="btn" href="${unique.length?lessonURL(unique[0].lessonId,unique[0].concept):'#home'}">${unique.length?'Start targeted revision':'Return to learning path'}</a><a class="btn secondary" href="#exam">Mock exam centre</a></div></section><section class="card" style="margin-top:22px"><h2>Answer review</h2><p class="small muted">Open any question for your answer, the correct answer and an explanation.</p>${h.ids.map(id=>renderReview(questions[id],h.answers[id],h.checked[id])).join('')}</section>`;
}
function renderProgress(){const c=counts();return pageHead('MY PROGRESS','Small steps add up.','Mastery is based on your best qualifying attempt. Every retry is another chance to understand.')+`<div class="stat-grid"><div class="card"><span class="small muted">Experience points</span><div class="stat-value">${state.xp} XP</div><p class="small muted">New answers + first-time mastery</p></div><div class="card"><span class="small muted">Course completion</span><div class="stat-value">${c.completion}%</div><p class="small muted">${c.done} lessons + ${c.badges} checkpoints mastered</p></div><div class="card"><span class="small muted">Completed mock exams</span><div class="stat-value">${state.examHistory.length}</div><p class="small muted">Best score: ${state.examHistory.length?Math.max(...state.examHistory.map(h=>h.percent))+'%':'Not taken yet'}</p></div></div><div class="badges">${sections.map(s=>`<section class="card badge-card ${state.sections[s.id]?.mastered?'earned':''}"><div class="badge-icon" aria-hidden="true">${state.sections[s.id]?.mastered?'✦':s.icon}</div><h3>${s.title}</h3><p>${state.sections[s.id]?.mastered?'Mastery badge earned':'Master 4 lessons, then score 8/10'}</p><a class="small" href="#section/${s.id}">${state.sections[s.id]?.mastered?'Revisit checkpoint':'View checkpoint'}</a></section>`).join('')}</div><section class="card" style="margin-top:24px"><h2>Lesson results</h2><div class="table-wrap"><table><thead><tr><th>Lesson</th><th>Status</th><th>Best</th><th>Attempts</th></tr></thead><tbody>${lessons.map(l=>{const p=state.lessons[l.id];return `<tr><td><a href="${lessonURL(l.id)}">${l.title}</a></td><td>${p?.mastered?'Mastered':p?.visited?'In progress':'Ready'}</td><td>${p?.best!==undefined?p.best+'/5':'—'}</td><td>${p?.attempts?.length||0}</td></tr>`;}).join('')}</tbody></table></div></section><section class="card" style="margin-top:24px"><h2>How points and completion work</h2><ul><li>5 XP for the first correct answer to each unique question.</li><li>40 XP when you first master a lesson.</li><li>100 XP when you first earn each unit badge.</li><li>100 XP for completing your first mock exam.</li></ul><p class="small muted">Retries do not repeatedly award the same points. Completion counts 16 lessons and 4 unit checkpoints equally. The mock is a separate readiness check.</p></section>`;}
function renderSettings(){return pageHead('SETTINGS & SOURCES','Make this space work for you.','One offline file. Progress saved in your current browser.')+`<section class="card settings-block"><div class="row wrap"><div><h2>Appearance</h2><p class="muted">Choose the theme you find easiest to read.</p></div><button class="btn secondary" data-action="theme">Use ${state.theme==='light'?'dark':'light'} mode</button></div></section><section class="card settings-block"><h2>Progress and privacy</h2><p>Answers, quiz scores, badges, XP and the active mock timer save automatically using localStorage. Nothing is sent to a server.</p><p class="small muted">Use the same browser and file location to keep your progress. Private browsing, clearing site data, moving the file or using another device may make your saved progress unavailable. Local-file storage support varies by browser.</p><div class="row wrap"><button class="btn secondary" data-action="reset">Reset Progress</button><span class="small muted">Clears this app’s progress, scores and active exam.</span></div></section><section class="card settings-block"><h2>Curriculum scope</h2><p>${esc(courseData.scope)}</p><h3>Supplied files</h3><ol class="source-list">${courseData.sources.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="small muted">The supplied files are labelled Grade 6 and use Stage 7 objective codes. Additional test-data labels from the revision guide are identified as further reading because the exam schemes exclude that terminology. Quiz wording avoids ambiguous or malformed source questions.</p></section>`;}
function highlightCode(root=document){$$('code.python',root).forEach(el=>{if(el.dataset.highlighted)return;const raw=el.textContent;const rx=/(#[^\n]*|"[^"\n]*"|'[^'\n]*'|\b(?:if|elif|else|and|or|not|True|False)\b|\b(?:print|input|int|float)\b|\b\d+(?:\.\d+)?\b)/g;let at=0,out='',m;while((m=rx.exec(raw))){out+=esc(raw.slice(at,m.index));const v=m[0],type=v.startsWith('#')?'comment':/^["']/.test(v)?'str':/^\d/.test(v)?'num':/^(print|input|int|float)$/.test(v)?'fn':'key';out+=`<span class="tok-${type}">${esc(v)}</span>`;at=rx.lastIndex;}out+=esc(raw.slice(at));el.innerHTML=out;el.dataset.highlighted='true';});}
function syncMenu(){const mobile=matchMedia('(max-width: 900px)').matches;const open=mobile?document.body.classList.contains('nav-open'):!document.body.classList.contains('sidebar-hidden');$('#menu-btn').setAttribute('aria-expanded',open);$('#sidebar').inert=!open;}
$('#menu-btn').onclick=()=>{if(matchMedia('(max-width: 900px)').matches)document.body.classList.toggle('nav-open');else document.body.classList.toggle('sidebar-hidden');syncMenu();};
$('#overlay').onclick=()=>{document.body.classList.remove('nav-open');syncMenu();};
function toggleTheme(){state.theme=state.theme==='light'?'dark':'light';save();updateChrome();if(getRoute().type==='settings')render();}
$('#theme-btn').onclick=toggleTheme;
$('#dialog-cancel').onclick=closeDialog;
$('#dialog-confirm').onclick=()=>{const fn=confirmAction;closeDialog();fn?.();};
$('#confirm-dialog').addEventListener('cancel',()=>{confirmAction=null;});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('nav-open');syncMenu();}if(e.key==='Enter'&&e.target.matches('[data-quiz-answer]')&&e.target.type==='text'){const el=$('#quiz-question');checkAnswer(el.dataset.kind,el.dataset.id);}});
document.addEventListener('input',e=>{if(e.target.matches('[data-quiz-answer]')){const el=$('#quiz-question'),run=state.sessions[el.dataset.kind+':'+el.dataset.id];if(run.checked[run.ids[run.index]]===undefined){run.answers[run.ids[run.index]]=e.target.type==='radio'?Number(e.target.value):e.target.value;save();}}if(e.target.matches('[data-exam-answer]'))updateExamAnswer(e.target.type==='radio'?Number(e.target.value):e.target.value);});
document.addEventListener('click',e=>{
 const scroll=e.target.closest('[data-scroll-quiz]');if(scroll){e.preventDefault();$('#micro-quiz')?.scrollIntoView({block:'start'});return;}
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,kind=b.dataset.kind,id=b.dataset.id;
 if(a==='start-quiz'){if(kind==='section'&&!unitUnlocked(id)){nav('#section/'+id);return;}newRun(kind,id);refreshQuiz(kind,id,'.question-title');}
 else if(a==='check-answer')checkAnswer(kind,id);
 else if(a==='next-question')nextQuestion(kind,id);
 else if(a==='theme')toggleTheme();
 else if(a==='start-exam')buildExam();
 else if(a==='submit-exam'&&state.exam){const n=state.exam.ids.filter(id=>!answered(questions[id],state.exam.answers[id])).length;confirm('Submit this mock exam?',`${n?n+' unanswered '+(n===1?'question will':'questions will')+' score zero. ':'All questions have an answer. '}Submission ends this attempt and reveals your readiness report.`,'Submit exam',()=>finishExam(false));}
 else if(a==='abandon-exam')confirm('Discard this attempt?','This removes the active exam and its answers. Your completed exam reports and lesson progress stay saved.','Discard attempt',()=>{state.exam=null;save();render();});
 else if(a==='reset')confirm('Reset all progress?','This permanently clears lesson scores, XP, badges, exam reports and any active mock in this browser. Your colour theme is kept.','Reset Progress',()=>{state=freshState(state.theme);storageWarning='';save();nav('#home');toast('Progress reset. Your next learning path starts here.');});
 else if(['exam-prev','exam-next','exam-jump','flag-exam'].includes(a)&&state.exam){if(Date.now()>=state.exam.deadline){finishExam(true);return;}if(a==='flag-exam'){const qid=state.exam.ids[state.exam.index];state.exam.flags[qid]=!state.exam.flags[qid];}else state.exam.index=a==='exam-prev'?Math.max(0,state.exam.index-1):a==='exam-next'?Math.min(24,state.exam.index+1):Number(b.dataset.index);save();const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});$('.question-title')?.setAttribute('tabindex','-1');$('.question-title')?.focus({preventScroll:true});}
});
window.addEventListener('hashchange',()=>{if(location.hash==='#main'){$('#main').focus();return;}render();});
window.addEventListener('resize',syncMenu);
document.addEventListener('visibilitychange',timerTick);
window.addEventListener('pageshow',timerTick);
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY){state=readState();recomputeXP();render(true);toast('Progress updated from another open tab.');}});
setInterval(timerTick,1000);
recomputeXP();
render();

</script>
</body>
</html>
